# ==============================================
# LXH 环境配置文件
# ==============================================
# 通过 --env 参数切换环境，如: pytest --env=test
# ==============================================

# 开发环境
dev:
  base_url: http://dev.example.com
  headers:
    X-Env: dev
  database:
    host: localhost
    port: 3306
    user: root
    password: dev123

# 测试环境
test:
  base_url: http://test.example.com
  headers:
    X-Env: test
  database:
    host: test-db.example.com
    port: 3306
    user: test_user
    password: test_pass

# 预发布环境
staging:
  base_url: http://staging.example.com
  headers:
    X-Env: staging

# 生产环境（谨慎使用）
prod:
  base_url: https://api.example.com
  headers:
    X-Env: prod
