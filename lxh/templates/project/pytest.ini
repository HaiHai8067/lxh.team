[pytest]
# ==============================================
# LXH 框架 pytest 配置
# ==============================================

# 测试用例目录
testpaths = tests

# 用例发现规则
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 禁用缓存插件（可选）
# addopts = -p no:cacheprovider

# 详细输出
# addopts = -v

# 失败立即停止
# addopts = -x

# 并行执行（需要安装 pytest-xdist）
# addopts = -n auto

# Allure 报告（需要安装 allure-pytest）
# addopts = --alluredir=reports/allure-results

# 标记
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    api: API 测试用例
    ui: UI 测试用例
    perf: 性能测试用例
    p0: P0 级别用例
    p1: P1 级别用例
    p2: P2 级别用例
